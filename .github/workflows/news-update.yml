name: עדכון חדשות הפאדל

on:
  schedule:
    # GitHub מדלג לפעמים על הפעלות, לכן "דופקים בדלת" כל 10 דקות.
    # שלב "בדיקת שעה" מחליט אם להריץ עדכון: רק לקראת השעות של מייקל (שעון ישראל).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["run-now.txt"]   # שינוי בקובץ הזה מפעיל עדכון מיד

concurrency:
  group: news-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: בדיקת שעה (האם צריך עדכון עכשיו)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # השעות שבהן העדכון צריך להיות באתר (שעון ישראל): 06,10,12,15,17,19,21,23,01
          # מתחילים עד 30 דקות לפני השעה, וממשיכים לנסות עד 90 דקות אחריה אם GitHub דילג.
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "הפעלה ידנית – מריצים"; exit 0; fi
          NOW=$(date +%s)
          LAST=$(git log -1 --format=%ct --grep="News update" origin/main 2>/dev/null || echo 0)
          [ -z "$LAST" ] && LAST=0
          RUN=false
          for H in 06 10 12 15 17 19 21 23 01; do
            for D in -1 0 1; do
              DAY=$(TZ=Asia/Jerusalem date -d "$D day" +%F)
              SLOT=$(TZ=Asia/Jerusalem date -d "$DAY $H:00" +%s)
              START=$((SLOT-1800)); END=$((SLOT+5400))
              if [ "$NOW" -ge "$START" ] && [ "$NOW" -lt "$END" ] && [ "$LAST" -lt "$START" ]; then RUN=true; echo "חלון של $DAY $H:00 – עוד לא עודכן, מריצים"; fi
            done
          done
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "run=$RUN"

      - name: פענוח ההוראות
        if: steps.guard.outputs.run == 'true'
        env:
          PNI_KEY: ${{ secrets.PNI_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in data/u.bin -k "$PNI_KEY" -out /tmp/instructions.md
          test -s /tmp/instructions.md && echo "instructions ok"

      - name: הגדרת git
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "Michael Kadosh"
          git config user.email "michael.kadosh@gmail.com"

      - name: התקנת Claude Code
        if: steps.guard.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: עדכון החדשות עם Claude
        if: steps.guard.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > /tmp/prompt.md <<'PROMPT_EOF'
          Scheduled update run (GitHub Actions; the site is updated at 06,10,12,15,17,19,21,23,01 Israel time) of Michael Kadosh's padel news app "חדשות הפאדל" (PadelNewsISR).
          The site is https://padelnewsisr.github.io/ — this repository (padelnewsisr/padelnewsisr.github.io), branch main, is checked out in the current directory.

          1. Read /tmp/instructions.md completely. It holds Michael's full, authoritative instructions (sources, rules, news.json schema, writing rules). They are private: never print them in full, never copy them into the repo, a commit or any output.
          2. Follow them as if written here, with these overrides: the repo is padelnewsisr/padelnewsisr.github.io (not Michael123450/padelnewsisr); it is already cloned in the current directory, so skip any clone step and work here. SKIP EVERYTHING ABOUT THE CLAUDE ARTIFACT (steps 0b/0c/0d, section 4B). There are no notifications to send. Keep the run efficient: at most ~45 web searches/fetches, in parallel batches.
          3. SAVE EARLY: as soon as you have new items, write news.json, validate it with python, commit ("News update <ISO time>") and push to main (`git pull --rebase origin main` then `git push origin HEAD:main`). If the rebase conflicts on news.json, redo your edit on top of the latest news.json. You may push again later with more items. Never end without pushing what you have.
          4. In main, never edit any file other than news.json. Never touch .github/, data/ or index.html.
          PROMPT_EOF
          claude -p "$(cat /tmp/prompt.md)" \
            --model opus \
            --max-turns 150 \
            --dangerously-skip-permissions \
            --output-format text

      - name: סימון שהעדכון רץ
        if: success() && steps.guard.outputs.run == 'true'
        run: |
          git pull -q --rebase origin main || true
          date -u +%FT%TZ > data/last-run.txt
          git add data/last-run.txt
          git commit -qm "News update marker $(date -u +%FT%TZ)" && git push -q origin HEAD:main || true

      - name: בקשה לבנות את האתר מחדש
        if: always() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
